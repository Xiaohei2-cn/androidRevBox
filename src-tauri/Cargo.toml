[package]
name = "app-reverse-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "app_reverse_tools_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
libloading = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
uuid = { version = "1.26.0", features = ["v4"] }
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3"
# 集成测试需要真实 cdylib 产物：依赖保证 cargo 先构建插件（同时产出 cdylib 与 rlib）
plugin-crypto-base64 = { path = "../plugins/crypto-base64" }

[target."cfg(unix)".dependencies]
libc = "0.2"
