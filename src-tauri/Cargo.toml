[package]
name = "app-reverse-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "app_reverse_tools_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"

[profile.release]
strip = true
lto = true
