[package]
name = "app-reverse-tools"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"

[lib]
name = "app_reverse_tools_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-protocol = { path = "../agent-protocol" }
tauri = { version = "2.8", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "process", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
libloading = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
uuid = { version = "1.26.0", features = ["v4"] }
async-trait = "0.1.92"
sha2 = "0.10"
# store 打包 .apks 容器用得到的 CRC32；该 crate 已在依赖图里（tauri→png→flate2），不新增下载
crc32fast = "1.5"
getrandom = "0.3"
tauri-plugin-dialog = "2.7.3"
portable-pty = "0.9.0"
# 工具市场下载二进制：reqwest 本来就在依赖图里（tauri → reqwest），显式声明只多一条边。
# 只开 rustls，不带 native-tls——不必依赖宿主 OpenSSL，三平台行为一致。
# `stream` 让文件按块落盘，不在内存里攒一份完整的 9 MB 再写。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

# ===== 算法中心（CyberChef 移植：内置算法注册表 + 配方执行）=====
# 版本一律锁在 digest 0.10 / cipher 0.4 这一代：混用 0.11/0.5 会让
# hmac / block-modes 的 trait bound 直接不成立。
base64 = "0.22"
hex = "0.4"
regex = "1"
rand = "0.8"
encoding_rs = "0.8"
md-5 = "0.10"
digest = "0.10"
sha1 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
md4 = "0.10"
ripemd = "0.1"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
cipher = "0.4"
aes = "0.8"
des = "0.8"
sm4 = "0.5"
sm3 = "0.4"
data-encoding = "2"
typenum = "1"
aes-gcm = "0.10"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["std", "pem", "sha1", "sha2"] }
bcrypt = "0.15"
flate2 = "1"
bzip2-rs = "0.1"
brotli = "8"

[dev-dependencies]
tempfile = "3"
# 集成测试需要真实 cdylib 产物：依赖保证 cargo 先构建插件（同时产出 cdylib 与 rlib）
plugin-crypto-base64 = { path = "../plugins/crypto-base64" }

[target."cfg(unix)".dependencies]
libc = "0.2"
