[workspace]
resolver = "3"
members = [
    "agent-protocol",
    "android-agent",
    "src-tauri",
    "plugin-sdk/rust",
    "plugins/crypto-base64",
    "plugins/process-echo",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"

# 统一 release 配置（原 src-tauri 内 profile 对 workspace 成员无效）
[profile.release]
strip = true
lto = true
