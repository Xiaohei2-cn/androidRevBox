name: Publish release

# 只补发布、不重建：把已经构建好的草稿 Release 转正。
# 用法：推 `publish-v0.2.3` tag，或在 Actions 里手动运行并填 tag。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.2.3"
        required: true
  push:
    tags: ["publish-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-v${REF_NAME#publish-}}"
          if [[ -z "$tag" ]]; then
            echo "error: 缺少 tag" >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '{draft: .isDraft, assets: [.assets[].name]}'
