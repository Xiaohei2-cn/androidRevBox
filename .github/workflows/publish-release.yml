name: Publish release

# 只补发布、不重建：把已经构建好的草稿 Release 转正。
# 用法：推 `publish-v0.2.3` tag，或在 Actions 里手动运行并填 tag。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.2.3"
        required: true
  push:
    tags: ["publish-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # publish-v0.2.3 → v0.2.3（前缀里已经带了 v，不能再补）
          tag="${INPUT_TAG:-${REF_NAME#publish-}}"
          if [[ -z "$tag" ]]; then
            echo "error: 缺少 tag" >&2
            exit 1
          fi
          # 草稿 Release 在 GitHub 上挂在 untagged-… 下，按 tag 查不到，必须按 id PATCH
          api="/repos/${GITHUB_REPOSITORY}/releases"
          id="$(gh api "$api?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\" and .draft) | .id][0]")"
          if [[ -z "$id" || "$id" == "null" ]]; then
            echo "找不到 $tag 的草稿 Release，现有 Release：" >&2
            gh api "$api?per_page=100" --jq '.[] | [.id, .tag_name, .draft] | @tsv' >&2
            exit 1
          fi
          echo '{"draft": false}' | gh api -X PATCH "$api/$id" --input - \
            --jq '{draft: .draft, tag: .tag_name, assets: [.assets[].name]}'
