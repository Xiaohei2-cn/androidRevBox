<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppReverseTools</title>
    <!-- 启动闪烁修复（第三轮，P7）：
         1) 主题 bootstrap 脚本在样式/React 之前按 localStorage/系统偏好定 .dark，
            消除首帧浅→深二次重绘；
         2) 不再铺 #boot-bg 不透明覆盖层——它本身就是「打开就是不透明」的元凶，
            且首帧空窗体的真实解法是玻璃静态层（见 globals.css .glass-layer）。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("app.settings.theme");
          var dark =
            t === "dark" ||
            ((t === "system" || !t) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage 不可用时保持浅色首帧 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
